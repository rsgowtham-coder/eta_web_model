<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailWatch AI - Sign In</title>
  <link rel="stylesheet" href="style.css">
  <script src="users.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <div class="brand auth-brand">
        <div class="brand-icon">🚆</div>
        <div>
          <h2>RailWatch AI</h2>
          <small>Smarter Journeys</small>
        </div>
      </div>

      <h1>Sign In</h1>
      <p class="auth-subtitle">Use your authorized credentials to access the correct console.</p>

      <form id="signinForm" novalidate>
        <label for="email">Email address</label>
        <input id="email" type="text" placeholder="Email or login ID" required>

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('password', this)">◉</button>
        </div>

        <button class="primary-btn auth-submit" type="submit">Sign In</button>
      </form>
      <p id="signinError" class="signin-error" role="alert"></p>

      <hr class="auth-divider">

      <h2 class="auth-section-title">Create passenger account</h2>
      <form id="signupForm" novalidate>
        <label for="signupEmail">Email address</label>
        <input id="signupEmail" type="email" placeholder="you@example.com" required>

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" placeholder="Create a password" required>

        <label for="signupConfirmPassword">Confirm password</label>
        <input id="signupConfirmPassword" type="password" placeholder="Repeat your password" required>

        <button class="secondary-btn auth-submit" type="submit">Sign Up</button>
      </form>
      <p id="signupMessage" class="signin-error" role="alert"></p>

      <a class="back-link" href="index.html">← Back to dashboard</a>
    </section>
  </main>

  <script>
    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? '◉' : '◎';
      button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }

    document.getElementById('signinForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('signinError');
      const users = getLoginUsers();
      let validUser = users.find(user => user.email.toLowerCase() === email && String(user.password) === password);

      const emailExists = users.some(user => user.email.toLowerCase() === email);
      if (!validUser && !emailExists && email.endsWith('@gmail.com') && password.length >= 6) {
        validUser = { email, password, role: 'user' };
        users.push(validUser);
        saveLoginUsers(users);
      }

      if (!email || !email.includes('@') || !validUser) {
        errorMessage.textContent = 'Invalid Email or Incorrect Password';
        return;
      }

      errorMessage.textContent = '';
      const role = ['admin', 'data', 'loco'].includes(validUser.role) ? validUser.role : 'user';
      sessionStorage.setItem('railwatch_session', JSON.stringify({ email: validUser.email, role }));
      window.location.href = role === 'user'
        ? 'my-trips.html'
        : role === 'loco'
          ? 'locopilot.html'
          : role === 'data'
            ? 'data.html'
            : 'admin.html';
    });

    document.getElementById('signupForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('signupEmail').value.trim().toLowerCase();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      const message = document.getElementById('signupMessage');
      const users = getLoginUsers();

      if (!email || !email.includes('@')) {
        message.textContent = 'Enter a valid email address.';
        return;
      }
      if (password.length < 6) {
        message.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      if (users.some(user => user.email.toLowerCase() === email)) {
        message.textContent = 'An account with this email already exists.';
        return;
      }

      users.push({ email, password, role: 'user' });
      saveLoginUsers(users);
      sessionStorage.setItem('railwatch_session', JSON.stringify({ email, role: 'user' }));
      window.location.href = 'my-trips.html';
    });
  </script>
</body>
</html>

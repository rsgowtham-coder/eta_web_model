<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RailWatch AI - Feedback</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-icon">🚆</div>

      <div>
        <h2>RailWatch AI</h2>
        <small>Smarter Journeys</small>
      </div>

    </div>


    <nav>

      <a href="index.html" class="nav-item">
        🏠 <span>Live Dashboard</span>
      </a>

      <a href="train.html" class="nav-item">
        🔍 <span>Train Search</span>
      </a>

      <a href="my-trips.html" class="nav-item">
        🎫 <span>My Trips</span>
      </a>

      <a href="alerts.html" class="nav-item">
        🔔 <span>Alerts</span><span class="alert-count" data-alert-count aria-label="Number of alerts">4</span>
      </a>

      <a href="feedback.html" class="nav-item active">
        💬 <span>Feedback</span>
      </a>

    </nav>

    <div class="auth-sidebar-links">
      <div class="language-setting">
        <label for="languageSelect">🌐 <span>Language</span></label>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="kn">ಕನ್ನಡ</option>
          <option value="ta">தமிழ்</option>
          <option value="ml">മലയാളം</option>
          <option value="te">తెలుగు</option>
        </select>
      </div>
      <details class="settings-menu">
        <summary>⚙ <span>Settings</span></summary>
        <a href="signin.html" class="auth-link">↪ <span>Sign In</span></a>
      </details>
    </div>

  </aside>


  <main class="main">

    <div class="page-header">

      <h1>Help Us Improve RailWatch AI</h1>

      <p>
        Your feedback helps us make ETA predictions more useful.
      </p>

    </div>


    <div class="feedback-layout">


      <!-- FEEDBACK FORM -->

      <section class="card feedback-form">

        <h2>Share Your Feedback</h2>

        <label>How was your experience?</label>

        <div class="rating">

          <button>😞</button>
          <button>😐</button>
          <button>🙂</button>
          <button>😊</button>
          <button>🤩</button>

        </div>


        <label>What would you like to tell us?</label>

        <textarea
          id="feedbackText"
          placeholder="Tell us about your experience..."
        ></textarea>


        <label>Feedback Type</label>

        <select>

          <option>ETA Prediction</option>
          <option>Train Tracking</option>
          <option>Alerts</option>
          <option>Train Search</option>
          <option>Bug Report</option>
          <option>Others</option>

        </select>


        <button
          class="primary-btn"
          onclick="submitFeedback()"
        >
          Submit Feedback
        </button>

      </section>


    </div>

  </main>

</div>


<script src="auth.js"></script>
<script src="app.js"></script>
<script src="client_sync.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RailWatch AI - Train Search</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-icon">🚆</div>

      <div>
        <h2>RailWatch AI</h2>
        <small>Smarter Journeys</small>
      </div>

    </div>

    <nav>

      <a href="index.html" class="nav-item">
        🏠 <span>Live Dashboard</span>
      </a>

      <a href="train.html" class="nav-item active">
        🔍 <span>Train Search</span>
      </a>

      <a href="my-trips.html" class="nav-item">
        🎫 <span>My Trips</span>
      </a>

      <a href="alerts.html" class="nav-item">
        🔔 <span>Alerts</span>
      </a>

      <a href="feedback.html" class="nav-item">
        💬 <span>Feedback</span>
      </a>

    </nav>

    <div class="auth-sidebar-links">
      <a href="signin.html" class="auth-link">↪ <span>Sign In</span></a>
    </div>

  </aside>


  <!-- MAIN CONTENT -->

  <main class="main">

    <div class="page-header">

      <h1>Find Your Train</h1>

    </div>


    <!-- SEARCH -->

    <div class="card search-box">

      <div class="search-input">

        <label>Train Number / Name</label>

        <input
          id="trainInput"
          type="text"
          placeholder="Example: 12627 or Karnataka Express"
          autocomplete="off"
        >

      </div>


      <div class="search-input">

        <label>From</label>

        <input
          id="fromInput"
          type="text"
          placeholder="Departure station"
        >

      </div>


      <div class="search-input">

        <label>To</label>

        <input
          id="toInput"
          type="text"
          placeholder="Destination station"
        >

      </div>


      <button
        class="primary-btn"
        id="searchButton"
      >
        🔍 Search Train
      </button>

    </div>


    <!-- SEARCH STATUS -->

    <div id="searchStatus" class="search-status"></div>


    <!-- RESULTS -->

    <section>

      <h2 class="section-heading-text">
        Available Trains
      </h2>


      <div id="trainResults"></div>

    </section>

  </main>

</div>


<script src="app.js"></script>
<script src="client_sync.js"></script>

</body>
</html>

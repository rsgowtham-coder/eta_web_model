<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailWatch AI - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin Specific Scaffolding */
    .admin-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .admin-nav {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e5eaf2;
      padding-bottom: 10px;
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .admin-tab {
      padding: 8px 16px;
      border-radius: 6px;
      background: #f1f5ff;
      color: #1260dc;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .admin-tab.active {
      background: #1260dc;
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #536078;
    }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px;
      border: 1px solid #dce2eb;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .table-actions button {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-edit { background: #e3edff; color: #1760d5; }
    .btn-delete { background: #ffe7e7; color: #e44343; }
    .edit-login-modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(19, 32, 68, .35);
      z-index: 10;
    }
    .edit-login-modal.open { display: grid; }
    .edit-login-dialog {
      width: min(100%, 440px);
      padding: 24px;
    }
    .edit-login-dialog h2 { margin-bottom: 18px; }
    .edit-login-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .admin-logout {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 5;
      background: white;
      border: 1px solid #e5eaf2;
      box-shadow: 0 4px 14px rgba(19, 32, 68, .08);
    }
    @media (max-width: 550px) {
      .admin-logout {
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body data-required-role="admin">

<div class="app">

  <!-- MAIN -->
  <main class="main admin-main">

    <div class="page-header">
      <h1>Admin</h1>
      <p>Manage passenger feedback and dashboard users.</p>
    </div>

    <!-- ADMIN TABS NAVIGATION -->
    <div class="admin-nav">
      <button class="admin-tab active" onclick="switchTab(event, 'tab-feedback')">💬 Feedback & Reports</button>
      <button class="admin-tab" onclick="switchTab(event, 'tab-users')">👥 User Management</button>
    </div>

    <div class="admin-container">

      <!-- 4. USER FEEDBACK AND REPORTS -->
      <section id="tab-feedback" class="tab-content">
        <div class="card section">
          <h2>Submitted Passenger Feedback</h2>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Type</th>
                  <th>Feedback Text</th>
                  <th>Rating</th>
                </tr>
              </thead>
              <tbody id="feedbackTableBody">
                <!-- Dynamically Rendered from localStorage -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 5. USER MANAGEMENT -->
      <section id="tab-users" class="tab-content">
        <div class="card section">
          <h2>Registered Dashboard Users</h2>
          <form id="userForm" class="user-form" onsubmit="addUser(event)">
            <div class="form-grid">
              <div class="form-group">
                <label for="loginEmail">Login Email / ID</label>
                <input type="text" id="loginEmail" placeholder="pilot@loco.eta.in" required>
              </div>
              <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-field">
                  <input type="password" id="loginPassword" placeholder="Enter password" required>
                  <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('loginPassword', this)">◉</button>
                </div>
              </div>
              <div class="form-group">
                <label for="loginRole">Panel Access</label>
                <select id="loginRole">
                  <option value="admin">Admin Panel</option>
                  <option value="loco">Loco Pilot Panel</option>
                  <option value="data">Data Console</option>
                </select>
              </div>
            </div>
            <button type="submit" class="primary-btn">Create Login</button>
          </form>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Login Email / ID</th>
                  <th>Panel Access</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <!-- Dynamically rendered from localStorage -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div>

  </main>
</div>

<a class="auth-link admin-logout" href="signin.html" onclick="signOut()">↪ <span>Log Out</span></a>

<div id="editLoginModal" class="edit-login-modal" role="dialog" aria-modal="true" aria-labelledby="editLoginTitle">
  <form id="editLoginForm" class="card edit-login-dialog" onsubmit="saveEditedUser(event)">
    <h2 id="editLoginTitle">Edit Login</h2>
    <div class="form-group">
      <label for="editLoginEmail">Login Email / ID</label>
      <input type="text" id="editLoginEmail" required>
    </div>
    <div class="form-group" style="margin-top: 12px;">
      <label for="editLoginPassword">Password</label>
      <div class="password-field">
        <input type="password" id="editLoginPassword" required>
        <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('editLoginPassword', this)">◉</button>
      </div>
    </div>
    <div class="form-group" style="margin-top: 12px;">
      <label for="editLoginRole">Panel Access</label>
      <select id="editLoginRole">
        <option value="admin">Admin Panel</option>
        <option value="loco">Loco Pilot Panel</option>
        <option value="data">Data Console</option>
      </select>
    </div>
    <p id="editLoginError" class="signin-error" role="alert"></p>
    <div class="edit-login-actions">
      <button type="button" class="secondary-btn" onclick="closeEditUser()">Cancel</button>
      <button type="submit" class="primary-btn">Save Changes</button>
    </div>
  </form>
</div>

<script src="users.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="admin_state.js"></script>
</body>
</html>

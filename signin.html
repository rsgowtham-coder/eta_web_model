<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailWatch AI - Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <div class="brand auth-brand">
        <div class="brand-icon">🚆</div>
        <div>
          <h2>RailWatch AI</h2>
          <small>Smarter Journeys</small>
        </div>
      </div>

      <h1>Sign In</h1>
      <p class="auth-subtitle">Access your saved trips and journey alerts.</p>

      <form id="signinForm">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>

        <button class="primary-btn auth-submit" type="submit">Sign In</button>
      </form>

      <a class="back-link" href="index.html">← Back to dashboard</a>
    </section>
  </main>

  <script>
    document.getElementById('signinForm').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>

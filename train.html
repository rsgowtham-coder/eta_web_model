<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RailWatch AI - Train Search</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-icon">🚆</div>

      <div>
        <h2>RailWatch AI</h2>
        <small>Smarter Journeys</small>
      </div>

    </div>

    <nav>

      <a href="index.html" class="nav-item">
        🏠 <span>Live Dashboard</span>
      </a>

      <a href="train.html" class="nav-item active">
        🔍 <span>Train Search</span>
      </a>

      <a href="my-trips.html" class="nav-item">
        🎫 <span>My Trips</span>
      </a>

      <a href="alerts.html" class="nav-item">
        🔔 <span>Alerts</span>
      </a>

      <a href="feedback.html" class="nav-item">
        💬 <span>Feedback</span>
      </a>

    </nav>

    <div class="auth-sidebar-links">
      <div class="language-setting">
        <label for="languageSelect">🌐 <span>Language</span></label>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="kn">ಕನ್ನಡ</option>
          <option value="ta">தமிழ்</option>
          <option value="ml">മലയാളം</option>
          <option value="te">తెలుగు</option>
        </select>
      </div>
      <details class="settings-menu">
        <summary>⚙ <span>Settings</span></summary>
        <a href="signin.html" class="auth-link">↪ <span>Sign In</span></a>
      </details>
    </div>

  </aside>


  <!-- MAIN CONTENT -->

  <main class="main">

    <div class="page-header">

      <h1>Find Your Train</h1>

    </div>


    <!-- SEARCH -->

    <div class="card search-box">

      <div class="search-input">

        <label>From</label>

        <input
          id="fromInput"
          type="text"
          placeholder="Departure station"
          list="stationOptions"
          autocomplete="off"
        >

      </div>


      <div class="search-input">

        <label>To</label>

        <input
          id="toInput"
          type="text"
          placeholder="Destination station"
          list="stationOptions"
          autocomplete="off"
        >

      </div>


      <button
        class="primary-btn"
        id="searchButton"
      >
        🔍 Search Train
      </button>

    </div>

    <datalist id="stationOptions">
      <option value="Hazrat Nizamuddin"></option>
      <option value="Mathura Junction"></option>
      <option value="Guntakal Junction"></option>
      <option value="Anantapur"></option>
      <option value="Dharmavaram"></option>
      <option value="KSR Bengaluru"></option>
      <option value="Kolar"></option>
      <option value="New Delhi"></option>
    </datalist>


    <!-- SEARCH STATUS -->

    <div id="searchStatus" class="search-status"></div>


    <!-- RESULTS -->

    <section>

      <h2 class="section-heading-text">
        Available Trains
      </h2>


      <div id="trainResults"></div>

    </section>

    <section class="card train-details section" id="trainDetails" hidden>
      <h2>Train Details</h2>
      <div class="train-details-grid">
        <div>
          <small>Train No</small>
          <strong id="detailsNumber"></strong>
        </div>
        <div>
          <small>Train Name</small>
          <strong id="detailsName"></strong>
        </div>
        <div class="train-path">
          <small>Path</small>
          <strong id="detailsPath"></strong>
        </div>
      </div>
      <div class="availability-block">
        <h3>Availability</h3>
        <div class="availability-days" id="detailsAvailability" aria-label="Weekly train availability"></div>
      </div>
    </section>

  </main>

</div>


<script src="app.js"></script>
<script src="client_sync.js"></script>

</body>
</html>
